<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta - Aprendendo Libras</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>

    <main class="login-container">

        <section class="login-card">
            <div class="login-logo">
    <img
        src="{{ url_for('static', filename='logo_projeto.png') }}"
        alt="Logo do projeto Aprendendo Libras"
    >
</div>

            <h1> Criar conta</h1>

            <p>Comece sua jornada de aprendizado em Libras.</p>

            <form action="{{ url_for('cadastrar') }}" method="POST">

                <label for="nome_usuario">
                    Nome de usuário
                </label>

                <input
                    type="text"
                    id="nome_usuario"
                    name="nome_usuario"
                    placeholder="Digite seu usuário"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">
                    Criar conta
                </button>
            {% if erro %}
           <div class="mensagem-erro">
           {{ erro }}
           </div>
           {% endif %}

            </form>

            <p class="cadastro">
                Já possui uma conta?
                <a href="{{ url_for('inicio') }}">Voltar para o login</a>
            </p>

        </section>

    </main>

</body>

</html>
